# Settings for scripts/convert-ocr.rb — TEMPLATE
# Copy this file for a new book (e.g. my-book.yml), then replace every placeholder.
# See scripts/README.md for the full workflow, and in-nez-perce-country.yml for a filled-in example.
# Regex values are Ruby regular expressions; keep them in single quotes so backslashes stay literal.
# All page numbers are PDF page numbers from ocr-pages.rb output, not the numbers printed on the pages.

# Running header printed at the top of each page, as it appears in the OCR text.
# Use \s* where the OCR inserts stray spaces, e.g. 'In Nez Perce Co\s*un\s*try'.
running_header: 'BOOK TITLE AS IT APPEARS IN THE HEADER'

# Chapters in reading order. `page` is the PDF page the chapter starts on.
# Each chapter runs until the page before the next one; the last runs to end_page.
# Output file is NN-slug.md, where NN is the position in this list.
# Optional per chapter: `order` (default position x 10) and `part` (default "Chapter <position>").
chapters:
  - { title: "Chapter One Title", page: 0, slug: chapter-one }
  - { title: "Chapter Two Title", page: 0, slug: chapter-two }
  - { title: "Chapter Three Title", page: 0, slug: chapter-three }
  # Front or back matter can set its own part, e.g.:
  # - { title: "Preface", page: 0, slug: preface, part: Front Matter }
  # - { title: "Appendix", page: 0, slug: appendix, part: Appendix }

# Last PDF page of content (the page before the index or other back matter you want to skip).
end_page: 0

# Pages to skip entirely, e.g. full-page scanned maps, plates, or photos. Leave [] if none.
skip_pages: []

# How footnotes are numbered: per_chapter (restart at 1 each chapter) or continuous (through the whole book).
footnote_numbering: per_chapter

# Book-specific OCR corrections, applied in order to every paragraph and footnote
# (before the script's general fixes). `replace` may use \1 for capture groups.
# Add entries after the first run, once you see which errors repeat.
text_fixes: []
  # - { find: '\btbe\b', replace: 'the' }        # example: "tbe" -> "the"
  # - { find: 'l(?=daho)', replace: 'I' }        # example: "ldaho" -> "Idaho"

# Words the split-word rejoiner must never create (check joins.txt after each run).
keep_apart: []
  # - percent

# Optional: paragraphs that open a quoted primary-source section. Group 1 becomes an ### heading,
# group 2 an italic description; text after `source_label` becomes a **Source:** line, and the
# following paragraphs are blockquoted. Uncomment and adapt only if the book has labelled excerpts.
# quoted_sections:
#   pattern: '\A(Account \d+\.\d+[a-z]?):\s*(.*)\z'
#   source_label: 'Source:'

# Optional: paragraph that starts a further-reading list. Group 1 becomes an #### heading;
# following short paragraphs containing a year become list items. Uncomment and adapt if needed.
# reading_list_pattern: '\A((?:Further reading|More information) (?:about|on) [^:]+):\s*(.*)\z'
